name: Codeforces Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Sync Codeforces solutions
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_SECRET: ${{ secrets.CF_API_SECRET }}
        run: python sync.py

      - name: Commit new solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add solutions/
            git commit -m "Sync Codeforces solutions"
            git push
          else
            echo "No new solutions to commit."
          fi
